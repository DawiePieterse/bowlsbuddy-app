# Weekly checks for vulnerable or outdated dependencies (PLAN.md section 6).
version: 2
updates:
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # Majors are pinned and upgraded deliberately with the test suite (PLAN.md section 11).
      - dependency-name: filament/*
        update-types: ["version-update:semver-major"]
      - dependency-name: livewire/livewire
        update-types: ["version-update:semver-major"]
      - dependency-name: laravel/framework
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
